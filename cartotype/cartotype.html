    --stage-vig:    rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --ocean:        #0A1215;
  --ocean-deep:   #060D0F;
  --panel:        #0F181C;
  --panel-2:      #142126;
  --panel-3:      #1A2A30;
  --rule:         #22343B;
  --rule-soft:    #1A2A30;
  --land:         #2A3A3E;
  --land-edge:    #4E666A;
  --border-line:  #3A4E52;
  --graticule:    rgba(180, 230, 230, .05);
  --text:         #D9E3E2;
  --text-dim:     #8AA0A1;
  --text-faint:   #5F7477;
  --magnet:       #EF5D96;
  --magnet-wash:  rgba(239, 93, 150, .16);
  --signal:       #58D2A7;
  --shadow:       0 0 0 1px rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.5);
  --stage-vig:    rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--panel);
  color: var(--text);
  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  font-size: 13px;
  font-variation-settings: 'wdth' 100;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
}

button, input, select, textarea { font: inherit; color: inherit; }

::selection { background: var(--magnet-wash); }

:focus-visible {
  outline: 2px solid var(--magnet);
  outline-offset: 1px;
}

.mono {
  font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}

.micro {
  font-size: 9.5px;
  font-weight: 600;
  font-variation-settings: 'wdth' 88;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* ---------- shell ------------------------------------------------------- */

.app {
  display: grid;
  grid-template-columns: 54px 1fr 316px;
  grid-template-rows: 46px 1fr 26px;
  grid-template-areas:
    "top   top   top"
    "rail  stage panel"
    "stat  stat  stat";
  height: 100dvh;
  width: 100vw;
}

.topbar {
  grid-area: top;
  display: flex;
  align-items: stretch;
  gap: 0;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  z-index: 5;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
  padding: 0 16px 0 14px;
  border-right: 1px solid var(--rule);
}

.brand-name {
  font-size: 15px;
  font-weight: 700;
  font-variation-settings: 'wdth' 116;
  letter-spacing: .015em;
  align-self: center;
}
.brand-name span { color: var(--magnet); }

.brand-sub {
  align-self: center;
  font-size: 9.5px;
  font-weight: 600;
  font-variation-settings: 'wdth' 85;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding-bottom: 1px;
}

.topgroup {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border-right: 1px solid var(--rule);
}
.topgroup.--right { border-right: 0; border-left: 1px solid var(--rule); margin-left: auto; }
.topgroup > .micro { margin-right: 2px; }

/* ---------- controls ---------------------------------------------------- */

.btn {
  appearance: none;
  border: 1px solid var(--rule);
  background: var(--panel-2);
  color: var(--text-dim);
  height: 26px;
  padding: 0 10px;
  border-radius: 2px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  font-variation-settings: 'wdth' 92;
  letter-spacing: .04em;
  white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--panel-3); color: var(--text); }
.btn:disabled { opacity: .38; cursor: default; }
.btn.--icon { width: 26px; padding: 0; justify-content: center; }
.btn.--on { border-color: var(--magnet); color: var(--magnet); background: var(--magnet-wash); }
.btn.--accent { color: var(--magnet); }

.seg {
  display: inline-flex;
  border: 1px solid var(--rule);
  border-radius: 2px;
  overflow: hidden;
  background: var(--panel-2);
}
.seg > button {
  appearance: none;
  border: 0;
  border-right: 1px solid var(--rule);
  background: transparent;
  color: var(--text-faint);
  height: 24px;
  padding: 0 9px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  font-variation-settings: 'wdth' 86;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.seg > button:last-child { border-right: 0; }
.seg > button:hover { color: var(--text); }
.seg > button[aria-pressed="true"] { background: var(--magnet-wash); color: var(--magnet); }

/* ---------- tool rail --------------------------------------------------- */

.rail {
  grid-area: rail;
  background: var(--panel);
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 3px;
  z-index: 4;
}

.tool {
  position: relative;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: background .12s, color .12s;
}
.tool:hover { background: var(--panel-2); color: var(--text); }
.tool[aria-pressed="true"] {
  background: var(--magnet-wash);
  border-color: var(--magnet);
  color: var(--magnet);
}
.tool[aria-pressed="true"]::before {
  content: "";
  position: absolute;
  left: -8px; top: 50%;
  transform: translateY(-50%);
  width: 2px; height: 18px;
  background: var(--magnet);
}
.tool .key {
  position: absolute;
  right: 3px; bottom: 2px;
  font-size: 8px;
  font-weight: 600;
  color: var(--text-faint);
  font-family: 'IBM Plex Mono', monospace;
}
.rail-rule { width: 22px; height: 1px; background: var(--rule); margin: 5px 0; }

/* modifier toggles read quieter than the exclusive tool choice */
.tool.--mod { color: var(--text-faint); }
.tool.--mod[aria-pressed="true"] {
  background: transparent;
  border-color: var(--rule);
  color: var(--text);
}
.tool.--mod[aria-pressed="true"]::before { display: none; }
.tool.--mod[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  top: 4px; right: 4px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--magnet);
}

/* tooltip */
.tip {
  position: absolute;
  left: 46px; top: 50%;
  transform: translateY(-50%);
  background: var(--text);
  color: var(--panel);
  padding: 4px 8px;
  border-radius: 2px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .03em;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .1s;
  z-index: 20;
}
.tool:hover .tip { opacity: 1; }

/* ---------- stage ------------------------------------------------------- */

.stage {
  grid-area: stage;
  position: relative;
  background: var(--ocean-deep);
  overflow: hidden;
  touch-action: none;
}
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 55%, var(--stage-vig) 100%);
}
.stage svg { display: block; width: 100%; height: 100%; }

.stage.--draw  { cursor: crosshair; }
.stage.--pan   { cursor: grab; }
.stage.--panning { cursor: grabbing; }
.stage.--fill  { cursor: copy; }
.stage.--select { cursor: default; }

.hud {
  position: absolute;
  pointer-events: none;
  z-index: 3;
}
.hud.--tl { left: 12px; top: 12px; }
.hud.--br { right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; }

.scalebar {
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-start;
  color: var(--text-faint);
}
.scalebar-track {
  height: 5px;
  border: 1px solid var(--text-faint);
  border-top: 0;
  min-width: 40px;
}

.onboard {
  position: absolute;
  left: 12px; top: 12px;
  width: 290px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-left: 2px solid var(--magnet);
  border-radius: 2px;
  box-shadow: var(--shadow);
  padding: 13px 14px 12px;
  z-index: 6;
}
.onboard h2 {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 700;
  font-variation-settings: 'wdth' 88;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.onboard ol { margin: 0; padding: 0 0 0 2px; list-style: none; display: grid; gap: 7px; }
.onboard li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 12px; line-height: 1.45; color: var(--text-dim); }
.onboard li b { color: var(--text); font-weight: 600; }
.onboard li i {
  font-style: normal;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--magnet);
  padding-top: 2px;
}
.onboard-close { margin-top: 11px; width: 100%; justify-content: center; }

/* ---------- panel ------------------------------------------------------- */

.panel {
  grid-area: panel;
  background: var(--panel);
  border-left: 1px solid var(--rule);
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 4;
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}
.panel::-webkit-scrollbar { width: 9px; }
.panel::-webkit-scrollbar-thumb { background: var(--rule); }

.sec { border-bottom: 1px solid var(--rule); }
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 9px 12px 8px;
  background: transparent;
  border: 0;
  cursor: pointer;
  text-align: left;
}
.sec-head:hover .micro { color: var(--text-dim); }
.sec-head .count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.sec-body { padding: 2px 12px 14px; display: grid; gap: 12px; }

.field { display: grid; gap: 5px; }
.field-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.field-top label { font-size: 11px; font-weight: 600; color: var(--text-dim); font-variation-settings: 'wdth' 94; }
.field-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: var(--magnet);
}
.field-note { font-size: 10.5px; line-height: 1.4; color: var(--text-faint); }

input[type="range"] {
  appearance: none;
  width: 100%;
  height: 16px;
  background: transparent;
  cursor: pointer;
  margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--rule);
}
input[type="range"]::-moz-range-track { height: 2px; background: var(--rule); }
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 11px; height: 11px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--magnet);
}
input[type="range"]::-moz-range-thumb {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--magnet);
}

.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  padding: 3px 0;
}
.switch span { font-size: 11.5px; font-weight: 600; color: var(--text-dim); font-variation-settings: 'wdth' 94; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch-track {
  flex: none;
  width: 26px; height: 14px;
  border: 1px solid var(--rule);
  background: var(--panel-2);
  border-radius: 8px;
  position: relative;
  transition: background .14s, border-color .14s;
}
.switch-track::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: transform .14s, background .14s;
}
.switch input:checked + .switch-track { border-color: var(--magnet); background: var(--magnet-wash); }
.switch input:checked + .switch-track::after { transform: translateX(12px); background: var(--magnet); }
.switch input:focus-visible + .switch-track { outline: 2px solid var(--magnet); outline-offset: 2px; }

/* palette */
.swatches {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.swatch {
  aspect-ratio: 1;
  border: 1px solid var(--rule);
  border-radius: 2px;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform .1s;
}
.swatch:hover { transform: translateY(-1px); }
.swatch[aria-pressed="true"] {
  box-shadow: inset 0 0 0 1.5px var(--panel), 0 0 0 1.5px var(--text);
  border-color: transparent;
}
.color-row { display: flex; align-items: center; gap: 8px; }
.color-row input[type="color"] {
  appearance: none;
  width: 30px; height: 26px;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: transparent;
  cursor: pointer;
}
.color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
.color-row input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 1px; }
.hexfield {
  flex: 1;
  height: 26px;
  border: 1px solid var(--rule);
  background: var(--panel-2);
  border-radius: 2px;
  padding: 0 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  min-width: 0;
}

/* territory list */
.tlist { display: grid; gap: 0; }
.trow {
  display: grid;
  grid-template-columns: 20px 14px 1fr auto;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer;
  background: transparent;
}
.trow:hover { background: var(--panel-2); }
.trow.--sel { background: var(--magnet-wash); }
.trow.--sel .tname { color: var(--text); }
.tidx {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.tchip {
  width: 13px; height: 13px;
  border-radius: 2px;
  border: 1px solid rgba(128,128,128,.45);
}
.tname {
  border: 0;
  background: transparent;
  padding: 2px 3px;
  font-size: 12px;
  font-weight: 600;
  font-variation-settings: 'wdth' 96;
  color: var(--text-dim);
  border-radius: 2px;
  min-width: 0;
  width: 100%;
}
.tname:hover { background: var(--panel-3); }
.tname:focus { background: var(--panel-3); outline: 1px solid var(--magnet); color: var(--text); }
.tacts { display: flex; gap: 1px; opacity: .55; }
.trow:hover .tacts, .trow.--sel .tacts { opacity: 1; }
.iconbtn {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  border: 0; background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  border-radius: 2px;
}
.iconbtn:hover { background: var(--panel-3); color: var(--text); }
.iconbtn.--danger:hover { color: var(--magnet); }

.empty {
  padding: 18px 14px 20px;
  text-align: center;
  color: var(--text-faint);
  font-size: 11.5px;
  line-height: 1.5;
}
.empty b { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 3px; }

/* inspector */
.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 10px;
  font-size: 11px;
}
.kv dt { color: var(--text-faint); font-weight: 600; font-variation-settings: 'wdth' 88; letter-spacing: .06em; text-transform: uppercase; font-size: 9.5px; align-self: center; }
.kv dd {
  margin: 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  text-align: right;
}

.btnrow { display: flex; gap: 5px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; justify-content: center; }

/* ---------- status ------------------------------------------------------ */

.statusbar {
  grid-area: stat;
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--panel);
  border-top: 1px solid var(--rule);
  padding: 0;
  overflow: hidden;
  z-index: 5;
}
.stat {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 11px;
  height: 100%;
  border-right: 1px solid var(--rule);
  white-space: nowrap;
}
.stat:last-child { border-right: 0; }
.stat .micro { font-size: 9px; }
.stat .v {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
}
.stat.--hint { color: var(--text-faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.stat.--live .v { color: var(--magnet); }
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--text-faint);
}
.dot.--on { background: var(--magnet); }
.dot.--sig { background: var(--signal); }

/* ---------- modal ------------------------------------------------------- */

.scrim {
  position: fixed; inset: 0;
  background: rgba(6, 14, 16, .58);
  display: grid;
  place-items: center;
  z-index: 40;
  padding: 24px;
}
.modal {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 3px;
  box-shadow: var(--shadow);
  width: min(720px, 100%);
  max-height: 82vh;
  display: flex;
  flex-direction: column;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--rule);
}
.modal-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  font-variation-settings: 'wdth' 90;
  letter-spacing: .13em;
  text-transform: uppercase;
}
.modal-body { padding: 12px 14px; overflow: auto; display: grid; gap: 10px; }
.modal-body p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--text-dim); }
.codebox {
  width: 100%;
  height: 260px;
  resize: vertical;
  background: var(--panel-2);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 9px 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--text-dim);
  white-space: pre;
  overflow: auto;
}
.modal-foot {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  padding: 11px 14px;
  border-top: 1px solid var(--rule);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 44px;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--panel);
  padding: 7px 14px;
  border-radius: 2px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .03em;
  z-index: 50;
  box-shadow: var(--shadow);
  animation: rise .18s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }

/* ---------- map svg ----------------------------------------------------- */

.snapring { animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%,100% { opacity: .95; } 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- responsive -------------------------------------------------- */

@media (max-width: 900px) {
  .app { grid-template-columns: 48px 1fr 0; }
  .panel {
    position: fixed;
    top: 46px; bottom: 26px; right: 0;
    width: 290px;
    transform: translateX(100%);
    transition: transform .18s ease-out;
    box-shadow: var(--shadow);
  }
  .panel.--open { transform: none; }
  .brand-sub { display: none; }
  .topgroup.--opt { display: none; }
}
@media (min-width: 901px) { .panel-toggle { display: none; } }

                    }
                  }, Icon(IC.trash, 13))
                )
              );
            }))
        ),

        selT ? h(Section, {
          title: selT.name, open: true, onToggle: function () { setSel(null); }
        },
          (function () {
            var area = selT.closed ? geoArea(selT.pts) : 0;
            var len = geoLength(selT.pts, selT.closed);
            var c = centroid(selT.pts.map(function (p) { return [p[0], p[1]]; }));
            var over = selT.closed ? countryAt(c[0], c[1]) : null;
            return T.dl({ className: 'kv' },
              T.dt(null, 'Nodes'), T.dd(null, selT.pts.length),
              T.dt(null, 'Perimeter'), T.dd(null, fmtDist(len)),
              selT.closed ? T.dt(null, 'Area') : null,
              selT.closed ? T.dd(null, fmtArea(area)) : null,
              T.dt(null, 'Shape'), T.dd(null, selT.closed ? 'Closed' : 'Open border'),
              over ? T.dt(null, 'Over') : null,
              over ? T.dd(null, over.name) : null
            );
          })(),
          h(Switch, {
            label: 'Smooth curves', checked: selT.smooth,
            onChange: function (v) { patch(selT.id, { smooth: v }); }
          }),
          !selT.closed ? T.div({ className: 'btnrow' },
            T.button({
              className: 'btn --accent',
              onClick: function () { patch(selT.id, { closed: true }); flash('Loop closed — it can be filled now'); }
            }, 'Close loop')
          ) : null,
          T.div({ className: 'btnrow' },
            T.button({
              className: 'btn',
              onClick: function () { patch(selT.id, { color: color, opacity: fillOpacity / 100 }); }
            }, 'Apply colour'),
            T.button({ className: 'btn', onClick: deleteSel }, Icon(IC.trash, 13), 'Delete')
          )
        ) : null,

        h(Section, {
          title: 'Reference layer', open: open.base,
          onToggle: function () { setOpen(Object.assign({}, open, { base: !open.base })); }
        },
          T.div({ className: 'field' },
            T.div({ className: 'field-top' },
              T.label(null, 'Projection'),
              T.span({ className: 'field-val' }, proj.label)
            ),
            T.div({ className: 'seg', style: { width: '100%' } }, Object.keys(PROJECTIONS).map(function (k) {
              return T.button({
                key: k, onClick: function () { setProjName(k); },
                'aria-pressed': projName === k ? 'true' : 'false',
                style: { flex: 1 }
              }, PROJECTIONS[k].short);
            })),
            T.div({ className: 'field-note' }, 'Territories are stored as longitude and latitude, so they follow the projection you choose.')
          ),
          T.div({ className: 'btnrow' },
            T.button({ className: 'btn', onClick: function () { zoomBy(1 / 1.35); } }, Icon(IC.minus, 13), 'Out'),
            T.button({ className: 'btn', onClick: function () { zoomBy(1.35); } }, Icon(IC.plus, 13), 'In'),
            T.button({ className: 'btn', onClick: fitView }, Icon(IC.fit, 13), 'Fit')
          ),
          h(Slider, {
            id: 'baseop', label: 'Underlay opacity', min: 0, max: 100, value: baseOpacity,
            display: baseOpacity + '%', onChange: setBaseOpacity,
            note: 'The real world is a guide, not a cage. Fade it back when your borders take over.'
          }),
          h(Switch, { label: 'Existing country borders', checked: showBorders, onChange: setShowBorders }),
          h(Switch, { label: 'Graticule', checked: showGrat, onChange: setShowGrat }),
          h(Switch, { label: 'Territory labels', checked: showLabels, onChange: setShowLabels }),
          T.div({ className: 'btnrow' },
            T.button({
              className: 'btn',
              onClick: function () {
                if (!tintCount) { flash('No country fills to clear'); return; }
                apply({ territories: doc.territories, tints: {} });
              }
            }, 'Clear country fills'),
            T.button({
              className: 'btn',
              onClick: function () {
                if (!doc.territories.length && !tintCount) return;
                apply({ territories: [], tints: {} });
                setSel(null);
                flash('Map cleared — ⌘Z restores it');
              }
            }, 'Clear all')
          )
        )
      ),

      /* ---- status ---- */
      T.footer({ className: 'statusbar' },
        T.div({ className: 'stat' },
          T.span({ className: 'micro' }, 'Lat'),
          T.span({ className: 'v' }, cursor ? fmtLat(cursor.lat) : '—'),
          T.span({ className: 'micro', style: { marginLeft: '6px' } }, 'Lon'),
          T.span({ className: 'v' }, cursor ? fmtLon(cursor.lon) : '—')
        ),
        T.div({ className: 'stat' },
          T.span({ className: 'micro' }, 'Proj'),
          T.span({ className: 'v' }, proj.label)
        ),
        T.div({ className: 'stat --live' },
          T.span({ className: 'dot' + (snapOn ? ' --on' : '') }),
          T.span({ className: 'micro' }, 'Magnet'),
          T.span({ className: 'v' }, snapOn ? snapRadius + 'px' : 'off')
        ),
        T.div({ className: 'stat' },
          T.span({ className: 'micro' }, 'Streamline'),
          T.span({ className: 'v' }, streamline + '%')
        ),
        T.div({ className: 'stat' },
          T.span({ className: 'micro' }, 'Territories'),
          T.span({ className: 'v' }, (doc.territories.length < 10 ? '0' : '') + doc.territories.length)
        ),
        T.div({ className: 'stat --hint' },
          stroke.current.active
            ? (stroke.current.willClose ? 'Release to close the loop' : 'Drawing — return to the start point to close')
            : pen.current.pts.length
              ? 'Click to add a node · Enter to finish · click the first node to close'
              : toolDef.hint
        )
      ),

      /* ---- modal ---- */
      modal === 'svg' ? T.div({
        className: 'scrim',
        onPointerDown: function (e) { if (e.target === e.currentTarget) setModal(null); }
      },
        T.div({ className: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Export' },
          T.div({ className: 'modal-head' },
            T.h2(null, 'Export'),
            T.button({ className: 'btn --icon', onClick: function () { setModal(null); }, 'aria-label': 'Close' }, Icon(IC.close, 14))
          ),
          T.div({ className: 'modal-body' },
            T.p(null, 'Standalone SVG of the full map — reference world, country fills and every territory, in the current projection. Paste it into any vector editor.'),
            T.textarea({
              className: 'codebox', readOnly: true, value: exportText,
              onFocus: function (e) { e.target.select(); }
            })
          ),
          T.div({ className: 'modal-foot' },
            T.button({
              className: 'btn',
              onClick: function () {
                copyText(JSON.stringify({ format: 'cartotype/1', projection: projName, doc: doc }, null, 1), 'Project JSON');
              }
            }, 'Copy project JSON'),
            T.button({ className: 'btn --on', onClick: function () { copyText(exportText, 'SVG'); } }, Icon(IC.copy, 14), 'Copy SVG')
          )
        )
      ) : null,

      toast ? T.div({ className: 'toast', role: 'status' }, toast) : null
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
